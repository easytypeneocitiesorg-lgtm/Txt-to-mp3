<!DOCTYPE html>
<html>
<head>
  <title>TXT To MP3</title>

  <style>
    body{
      background:#000;
      color:#fff;
      font-family:Arial;
      padding:20px;
    }

    h1{
      margin-bottom:10px;
    }

    .box{
      background:#111;
      border:1px solid #333;
      padding:15px;
      margin-top:15px;
    }

    input{
      margin-top:15px;
    }

    button{
      margin-top:20px;
      padding:10px 20px;
      background:white;
      color:black;
      border:none;
      cursor:pointer;
      font-size:16px;
    }
  </style>
</head>
<body>

<h1>TXT to MP3 Converter</h1>

<p>
Upload a TXT file with frequencies:
</p>

<div class="box">
440<br>
660<br>
880<br>
330
</div>

<input
  type="file"
  id="fileInput"
  accept=".txt"
/>

<br>

<label>
Length Per Note (seconds):
</label>

<br>

<input
  type="number"
  id="lengthInput"
  value="1"
  step="0.1"
  min="0.1"
/>

<br>

<button onclick="generateAudio()">
Generate MP3
</button>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

<script>
function generateTone(
  frequency,
  duration
){

  const sampleRate = 44100;

  const samples =
    sampleRate * duration;

  const pcm =
    new Int16Array(samples);

  for(let i = 0; i < samples; i++){

    const t = i / sampleRate;

    const wave =
      Math.sin(
        2 *
        Math.PI *
        frequency *
        t
      );

    pcm[i] = wave * 32767 * 0.5;
  }

  return pcm;
}

function mergeBuffers(buffers){

  let totalLength = 0;

  for(const b of buffers){
    totalLength += b.length;
  }

  const merged =
    new Int16Array(totalLength);

  let offset = 0;

  for(const b of buffers){

    merged.set(b, offset);

    offset += b.length;
  }

  return merged;
}

function pcmToMp3(pcm){

  const mp3encoder =
    new lamejs.Mp3Encoder(
      1,
      44100,
      128
    );

  const mp3Data = [];

  const blockSize = 1152;

  for(
    let i = 0;
    i < pcm.length;
    i += blockSize
  ){

    const chunk =
      pcm.subarray(
        i,
        i + blockSize
      );

    const mp3buf =
      mp3encoder.encodeBuffer(chunk);

    if(mp3buf.length > 0){
      mp3Data.push(mp3buf);
    }
  }

  const end =
    mp3encoder.flush();

  if(end.length > 0){
    mp3Data.push(end);
  }

  return new Blob(mp3Data,{
    type:"audio/mp3"
  });
}

function generateAudio(){

  const file =
    document.getElementById("fileInput")
    .files[0];

  if(!file){

    alert("Upload a TXT file.");

    return;
  }

  const noteLength =
    Number(
      document.getElementById(
        "lengthInput"
      ).value
    );

  const reader =
    new FileReader();

  reader.onload = function(e){

    const text =
      e.target.result;

    const lines =
      text.split("\n");

    const buffers = [];

    for(let line of lines){

      line = line.trim();

      if(line === "") continue;

      const frequency =
        Number(line);

      if(isNaN(frequency))
        continue;

      const tone =
        generateTone(
          frequency,
          noteLength
        );

      buffers.push(tone);
    }

    const merged =
      mergeBuffers(buffers);

    const mp3 =
      pcmToMp3(merged);

    const url =
      URL.createObjectURL(mp3);

    const a =
      document.createElement("a");

    a.href = url;

    a.download = "output.mp3";

    a.click();
  };

  reader.readAsText(file);
}
</script>

</body>
</html>
