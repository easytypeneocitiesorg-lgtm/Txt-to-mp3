<!DOCTYPE html>
<html>
<head>
  <title>TXT to MP3</title>

  <style>
    body{
      background:black;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    .box{
      background:#111;
      border:1px solid #333;
      padding:15px;
      margin-top:15px;
      white-space:pre-line;
    }

    button{
      margin-top:20px;
      padding:10px 20px;
      background:white;
      color:black;
      border:none;
      cursor:pointer;
      font-size:16px;
    }

    input{
      margin-top:20px;
    }
  </style>
</head>
<body>

<h1>TXT to MP3 Converter</h1>

<p>
Upload a TXT file formatted like this:
</p>

<div class="box">440
sine
2

880
square
1

220
triangle
3
</div>

<p>
Format:
<br><br>
frequency
<br>
waveform
<br>
seconds
</p>

<input
  type="file"
  id="fileInput"
  accept=".txt"
/>

<br>

<button onclick="generateAudio()">
Generate MP3
</button>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

<script>

function createTone(
  frequency,
  waveform,
  duration
){

  const sampleRate = 44100;

  const samples =
    sampleRate * duration;

  const pcm =
    new Int16Array(samples);

  for(let i = 0; i < samples; i++){

    const t = i / sampleRate;

    let wave = 0;

    if(waveform === "square"){

      wave =
        Math.sin(
          2 *
          Math.PI *
          frequency *
          t
        ) > 0 ? 1 : -1;

    }
    else if(waveform === "triangle"){

      wave =
        Math.asin(
          Math.sin(
            2 *
            Math.PI *
            frequency *
            t
          )
        ) * (2 / Math.PI);

    }
    else if(waveform === "sawtooth"){

      wave =
        2 * (
          frequency * t -
          Math.floor(
            frequency * t + 0.5
          )
        );

    }
    else{

      wave =
        Math.sin(
          2 *
          Math.PI *
          frequency *
          t
        );
    }

    pcm[i] =
      wave *
      32767 *
      0.5;
  }

  return pcm;
}

function mergeBuffers(buffers){

  let totalLength = 0;

  for(const b of buffers){
    totalLength += b.length;
  }

  const merged =
    new Int16Array(totalLength);

  let offset = 0;

  for(const b of buffers){

    merged.set(b, offset);

    offset += b.length;
  }

  return merged;
}

function pcmToMp3(pcm){

  const encoder =
    new lamejs.Mp3Encoder(
      1,
      44100,
      128
    );

  const mp3Data = [];

  const blockSize = 1152;

  for(
    let i = 0;
    i < pcm.length;
    i += blockSize
  ){

    const chunk =
      pcm.subarray(
        i,
        i + blockSize
      );

    const mp3buf =
      encoder.encodeBuffer(chunk);

    if(mp3buf.length > 0){
      mp3Data.push(mp3buf);
    }
  }

  const end = encoder.flush();

  if(end.length > 0){
    mp3Data.push(end);
  }

  return new Blob(mp3Data,{
    type:"audio/mp3"
  });
}

function generateAudio(){

  const file =
    document.getElementById(
      "fileInput"
    ).files[0];

  if(!file){

    alert(
      "Upload a TXT file first."
    );

    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e){

    const text =
      e.target.result;

    const lines =
      text
      .split("\n")
      .map(x => x.trim())
      .filter(x => x !== "");

    const buffers = [];

    for(
      let i = 0;
      i < lines.length;
      i += 3
    ){

      const frequency =
        Number(lines[i]);

      const waveform =
        lines[i + 1];

      const duration =
        Number(lines[i + 2]);

      if(
        isNaN(frequency) ||
        isNaN(duration)
      ){
        continue;
      }

      const tone =
        createTone(
          frequency,
          waveform,
          duration
        );

      buffers.push(tone);
    }

    const merged =
      mergeBuffers(buffers);

    const mp3 =
      pcmToMp3(merged);

    const url =
      URL.createObjectURL(mp3);

    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "output.mp3";

    a.click();
  };

  reader.readAsText(file);
}

</script>

</body>
</html>
