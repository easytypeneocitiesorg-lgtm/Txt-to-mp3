<!DOCTYPE html>
<html>
<head>
  <title>TXT to MP3</title>

  <style>
    body{
      background:black;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    .box{
      background:#111;
      border:1px solid #333;
      padding:15px;
      margin-top:15px;
      white-space:pre-line;
    }

    button{
      margin-top:20px;
      padding:10px 20px;
      background:white;
      color:black;
      border:none;
      cursor:pointer;
      font-size:16px;
    }

    input{
      margin-top:20px;
    }
  </style>
</head>
<body>

<h1>TXT to MP3 Converter</h1>

<p>
Upload a TXT file formatted like this:
</p>

<div class="box">440
sine
1
3

660
square
1
3

220
triangle
0
2
</div>

<p>
Format:
<br><br>
frequency
<br>
waveform
<br>
overlap (1 or 0)
<br>
seconds
</p>

<input
  type="file"
  id="fileInput"
  accept=".txt"
/>

<br>

<button onclick="generateAudio()">
Generate MP3
</button>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

<script>

function pcmToMp3(pcm){

  const encoder =
    new lamejs.Mp3Encoder(
      1,
      44100,
      128
    );

  const mp3Data = [];

  const blockSize = 1152;

  for(
    let i = 0;
    i < pcm.length;
    i += blockSize
  ){

    const chunk =
      pcm.subarray(
        i,
        i + blockSize
      );

    const mp3buf =
      encoder.encodeBuffer(chunk);

    if(mp3buf.length > 0){
      mp3Data.push(mp3buf);
    }
  }

  const end = encoder.flush();

  if(end.length > 0){
    mp3Data.push(end);
  }

  return new Blob(mp3Data,{
    type:"audio/mp3"
  });
}

function generateAudio(){

  const file =
    document.getElementById(
      "fileInput"
    ).files[0];

  if(!file){

    alert(
      "Upload a TXT file first."
    );

    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e){

    const text =
      e.target.result;

    const lines =
      text
      .split("\n")
      .map(x => x.trim())
      .filter(x => x !== "");

    const sampleRate = 44100;

    let currentTime = 0;

    const notes = [];

    for(
      let i = 0;
      i < lines.length;
      i += 4
    ){

      const frequency =
        Number(lines[i]);

      const waveform =
        lines[i + 1];

      const overlap =
        Number(lines[i + 2]);

      const duration =
        Number(lines[i + 3]);

      if(
        isNaN(frequency) ||
        isNaN(duration)
      ){
        continue;
      }

      notes.push({
        frequency,
        waveform,
        duration,
        startTime: currentTime
      });

      if(overlap === 0){
        currentTime += duration;
      }
    }

    let totalDuration = 0;

    for(const note of notes){

      const endTime =
        note.startTime +
        note.duration;

      if(endTime > totalDuration){
        totalDuration = endTime;
      }
    }

    const totalSamples =
      Math.ceil(
        totalDuration *
        sampleRate
      );

    const finalBuffer =
      new Int16Array(totalSamples);

    for(const note of notes){

      const startSample =
        Math.floor(
          note.startTime *
          sampleRate
        );

      const noteSamples =
        Math.floor(
          note.duration *
          sampleRate
        );

      for(
        let i = 0;
        i < noteSamples;
        i++
      ){

        const t =
          i / sampleRate;

        let wave = 0;

        if(
          note.waveform === "square"
        ){

          wave =
            Math.sin(
              2 *
              Math.PI *
              note.frequency *
              t
            ) > 0 ? 1 : -1;

        }
        else if(
          note.waveform === "triangle"
        ){

          wave =
            Math.asin(
              Math.sin(
                2 *
                Math.PI *
                note.frequency *
                t
              )
            ) * (2 / Math.PI);

        }
        else if(
          note.waveform === "sawtooth"
        ){

          wave =
            2 * (
              note.frequency * t -
              Math.floor(
                note.frequency *
                t + 0.5
              )
            );

        }
        else{

          wave =
            Math.sin(
              2 *
              Math.PI *
              note.frequency *
              t
            );
        }

        const sample =
          wave * 12000;

        const index =
          startSample + i;

        if(index < finalBuffer.length){

          finalBuffer[index] += sample;

          if(finalBuffer[index] > 32767){
            finalBuffer[index] = 32767;
          }

          if(finalBuffer[index] < -32768){
            finalBuffer[index] = -32768;
          }
        }
      }
    }

    const mp3 =
      pcmToMp3(finalBuffer);

    const url =
      URL.createObjectURL(mp3);

    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "output.mp3";

    a.click();
  };

  reader.readAsText(file);
}

</script>

</body>
</html>
